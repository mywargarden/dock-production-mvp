name: Apply Chrome import harness correction

on:
  push:
    branches:
      - release-dock-0-3-12-continuity
    paths:
      - scripts/apply_chrome_import_harness_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-dock-0-3-12-continuity
          fetch-depth: 0
      - name: Apply assertion-guarded harness correction
        run: python3 scripts/apply_chrome_import_harness_fix.py
      - name: Verify extension static gate
        run: bash scripts/static_check.sh
      - name: Remove one-shot patch tooling
        run: git rm scripts/apply_chrome_import_harness_fix.py .github/workflows/apply-chrome-import-harness-fix.yml
      - name: Commit harness correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/chrome_extension_7.mjs
          git commit -m "Follow legacy import UI contract in Chrome 7"
          git push origin HEAD:release-dock-0-3-12-continuity
