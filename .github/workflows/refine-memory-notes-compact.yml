name: Refine Dock 0.3.7 Memory Notes Compact

on:
  push:
    branches:
      - restore-memory-notes-0-3-7
    paths:
      - scripts/refine_memory_notes_compact.py
      - .github/workflows/refine-memory-notes-compact.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-memory-notes-0-3-7
          fetch-depth: 0

      - name: Apply compact notes refinement
        run: python3 scripts/refine_memory_notes_compact.py

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          node --check dock-extension/memories.js
          test "$(node -p "require('./dock-extension/manifest.json').version")" = "0.3.7"
          grep -q 'note.rows = 1' dock-extension/memories.js
          grep -q 'Math.min(Math.max(note.scrollHeight, 34), 68)' dock-extension/memories.js
          grep -q 'Dock 0.3.7 notes compact refinement' dock-extension/memories.css
          grep -q 'border:0 !important' dock-extension/memories.css

      - name: Commit refined candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dock-release-bot'
          git config user.email 'dock-release-bot@users.noreply.github.com'
          git add dock-extension/memories.js dock-extension/memories.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Refine Dock memory notes to compact layout'
            git push origin HEAD:restore-memory-notes-0-3-7
          fi
