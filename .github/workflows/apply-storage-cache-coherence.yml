name: Apply managed cache coherence fix

on:
  push:
    branches:
      - release-dock-0-3-12-continuity
    paths:
      - scripts/apply_storage_cache_coherence.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-dock-0-3-12-continuity
          fetch-depth: 0
      - name: Apply assertion-guarded cache coherence patch
        run: python3 scripts/apply_storage_cache_coherence.py
      - name: Verify extension static gate
        run: bash scripts/static_check.sh
      - name: Remove one-shot patch tooling
        run: git rm scripts/apply_storage_cache_coherence.py .github/workflows/apply-storage-cache-coherence.yml
      - name: Commit production fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dock-extension/core/storage.js
          git commit -m "Keep managed workspace caches coherent across extension contexts"
          git push origin HEAD:release-dock-0-3-12-continuity
