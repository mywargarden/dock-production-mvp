name: One Truth Lockfile

on:
  push:
    branches:
      - one-truth-next15-candidate
    paths:
      - dock-admin-app/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dock-admin-app/package-lock.json
      - name: Regenerate package lock
        working-directory: dock-admin-app
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit reproducible lockfile
        run: |
          if git diff --quiet -- dock-admin-app/package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "dock-one-truth-bot"
          git config user.email "dock-one-truth-bot@users.noreply.github.com"
          git add dock-admin-app/package-lock.json
          git commit -m "Regenerate Next 15.5.24 lockfile from current main"
          git push
