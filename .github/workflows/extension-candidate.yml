name: Dock 0.3.12 Candidate Artifact

on:
  pull_request:
    paths:
      - dock-extension/**
      - scripts/static_check.sh
      - scripts/find_junk.sh
      - .github/workflows/extension-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "Candidate head: $actual"
      - name: Static gate
        run: bash scripts/static_check.sh
      - name: Build exact store-ready candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate-out
          mkdir -p candidate-out/Dock-0.3.12
          rsync -a dock-extension/ candidate-out/Dock-0.3.12/ \
            --exclude='*.md' \
            --exclude='background.js' \
            --exclude='import.js'

          test -f candidate-out/Dock-0.3.12/manifest.json
          test -f candidate-out/Dock-0.3.12/background-v2.js
          test -f candidate-out/Dock-0.3.12/import-v2.js
          test ! -e candidate-out/Dock-0.3.12/background.js
          test ! -e candidate-out/Dock-0.3.12/import.js

          extension_tree="$(git rev-parse HEAD:dock-extension)"
          printf 'commit=%s\nversion=0.3.12\nextension_tree=%s\n' "$CANDIDATE_SHA" "$extension_tree" > candidate-out/ARTIFACT_ID.txt
          printf '%s\n' "$extension_tree" > candidate-out/SOURCE_EXTENSION_TREE.txt
          (
            cd candidate-out/Dock-0.3.12
            find . -type f -print | LC_ALL=C sort
          ) > candidate-out/FILE_MANIFEST.txt
          (
            cd candidate-out/Dock-0.3.12
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > candidate-out/FILE_SHA256_MANIFEST.txt

          # Chrome Web Store packages require manifest.json at the ZIP root.
          (
            cd candidate-out/Dock-0.3.12
            zip -X -q -r ../Dock-0.3.12.zip .
          )
          sha256sum candidate-out/Dock-0.3.12.zip > candidate-out/Dock-0.3.12.zip.sha256

          # Fail closed if packaging regresses to a wrapper-directory ZIP.
          unzip -Z1 candidate-out/Dock-0.3.12.zip | grep -qx 'manifest.json'
          if unzip -Z1 candidate-out/Dock-0.3.12.zip | grep -q '^Dock-0.3.12/'; then
            echo 'Store package must not contain a Dock-0.3.12 wrapper directory.' >&2
            exit 1
          fi
          test "$(unzip -p candidate-out/Dock-0.3.12.zip manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = '0.3.12'
          test -n "$(unzip -p candidate-out/Dock-0.3.12.zip manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).background?.service_worker||""))')"
      - name: Upload candidate with lineage
        uses: actions/upload-artifact@v4
        with:
          name: Dock-0.3.12-${{ env.CANDIDATE_SHA }}
          path: |
            candidate-out/Dock-0.3.12.zip
            candidate-out/Dock-0.3.12.zip.sha256
            candidate-out/ARTIFACT_ID.txt
            candidate-out/SOURCE_EXTENSION_TREE.txt
            candidate-out/FILE_MANIFEST.txt
            candidate-out/FILE_SHA256_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
