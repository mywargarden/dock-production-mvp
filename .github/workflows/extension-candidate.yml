name: Dock Extension Candidate Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dock-extension/**'
      - 'scripts/static_check.sh'
      - '.github/workflows/extension-candidate.yml'

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "Candidate head: $actual"
      - name: Static release gate
        run: bash scripts/static_check.sh
      - name: Build exact store-ready candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./dock-extension/manifest.json').version")"
          WORKER="$(node -p "require('./dock-extension/manifest.json').background.service_worker")"
          OUT="candidate-out/Dock-${VERSION}"
          rm -rf candidate-out
          mkdir -p "$OUT"
          rsync -a dock-extension/ "$OUT/" \
            --exclude='*.md' \
            --exclude='background.js' \
            --exclude='import.js' \
            --exclude='crazy-ducky-theme.png' \
            --exclude='dock-default-center copy.png' \
            --exclude='dock-default-center.png' \
            --exclude='dock-sunset.png' \
            --exclude='dock_logo_lifted.png' \
            --exclude='rubber-ducky-theme.png' \
            --exclude='screenshot-unavailable.png' \
            --exclude='tie-dye-bg.png'

          test -f "$OUT/manifest.json"
          test -f "$OUT/$WORKER"
          test -f "$OUT/background-v2.js"
          test -f "$OUT/dock-sidecar.js"
          test -f "$OUT/floating-dock.js"
          test -f "$OUT/newtab.html"
          test ! -e "$OUT/background.js"
          test ! -e "$OUT/import.js"

          extension_tree="$(git rev-parse HEAD:dock-extension)"
          printf 'commit=%s\nversion=%s\nextension_tree=%s\n' "$CANDIDATE_SHA" "$VERSION" "$extension_tree" > candidate-out/ARTIFACT_ID.txt
          printf '%s\n' "$extension_tree" > candidate-out/SOURCE_EXTENSION_TREE.txt
          (cd "$OUT" && find . -type f -print | LC_ALL=C sort) > candidate-out/FILE_MANIFEST.txt
          (cd "$OUT" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > candidate-out/FILE_SHA256_MANIFEST.txt

          (cd "$OUT" && zip -X -q -r "../Dock-${VERSION}.zip" .)
          sha256sum "candidate-out/Dock-${VERSION}.zip" > "candidate-out/Dock-${VERSION}.zip.sha256"

          unzip -Z1 "candidate-out/Dock-${VERSION}.zip" | grep -qx 'manifest.json'
          if unzip -Z1 "candidate-out/Dock-${VERSION}.zip" | grep -Eq '\.zip$|^Dock-[^/]+/'; then
            echo 'Store package contains a nested archive or wrapper directory.' >&2
            exit 1
          fi
          test "$(unzip -p "candidate-out/Dock-${VERSION}.zip" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "$VERSION"
          test "$(unzip -p "candidate-out/Dock-${VERSION}.zip" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).background?.service_worker||""))')" = "$WORKER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload candidate with lineage
        uses: actions/upload-artifact@v4
        with:
          name: Dock-${{ env.VERSION }}-${{ env.CANDIDATE_SHA }}
          path: |
            candidate-out/Dock-${{ env.VERSION }}.zip
            candidate-out/Dock-${{ env.VERSION }}.zip.sha256
            candidate-out/ARTIFACT_ID.txt
            candidate-out/SOURCE_EXTENSION_TREE.txt
            candidate-out/FILE_MANIFEST.txt
            candidate-out/FILE_SHA256_MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
