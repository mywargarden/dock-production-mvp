name: One-time Safe Harbor cleanup

on:
  push:
    branches:
      - release-dock-0-3-12-continuity
    paths:
      - .github/workflows/one-time-memories-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-dock-0-3-12-continuity
      - name: Apply assertion-guarded source cleanup
        run: python3 scripts/cleanup_memories_0312.py
      - name: Verify extension static gate
        run: bash scripts/static_check.sh
      - name: Commit source cleanup
        run: |
          git config user.name "Dock RC1 hardening"
          git config user.email "actions@users.noreply.github.com"
          git add dock-extension/memories.js
          git diff --cached --check
          git commit -m "Remove Safe Harbor polling and watermark scanner"
          git push origin HEAD:release-dock-0-3-12-continuity
