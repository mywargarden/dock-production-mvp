name: Package Dock 0.3.7 Compact Notes

on:
  push:
    branches:
      - restore-memory-notes-0-3-7
    paths:
      - .github/workflows/package-memory-notes-compact.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-memory-notes-0-3-7

      - name: Verify compact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check dock-extension/memories.js
          test "$(node -p "require('./dock-extension/manifest.json').version")" = "0.3.7"
          grep -q 'Dock 0.3.7 notes compact refinement' dock-extension/memories.css
          grep -q 'note.rows = 1' dock-extension/memories.js

      - name: Build extension zip
        shell: bash
        run: |
          set -euo pipefail
          cd dock-extension
          zip -qr ../dock-0.3.7-memory-notes-compact.zip .
          cd ..
          sha256sum dock-0.3.7-memory-notes-compact.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dock-0.3.7-memory-notes-compact
          path: dock-0.3.7-memory-notes-compact.zip
          if-no-files-found: error
