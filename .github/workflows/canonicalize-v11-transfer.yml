name: Canonicalize Dock 0.3.6 v11

on:
  push:
    branches:
      - canonicalize-dock-0-3-6-final
    paths:
      - .github/workflows/canonicalize-v11-transfer.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonicalization branch
        uses: actions/checkout@v4
        with:
          ref: canonicalize-dock-0-3-6-final
          fetch-depth: 0

      - name: Fetch and verify accepted v11 artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://at.adobe.com/B89lWsg1fojMHaZY'
          EXPECTED_SHA='bd4286c8a9338f690878a9f30d0edbc59bb82ea8e373c1c2f649b0057259d203'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/dock-v11.zip
          ACTUAL_SHA="$(sha256sum /tmp/dock-v11.zip | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "artifact_sha=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Replace dock-extension with exact accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dock-v11
          mkdir -p /tmp/dock-v11
          unzip -q /tmp/dock-v11.zip -d /tmp/dock-v11
          test "$(find /tmp/dock-v11 -type f | wc -l | tr -d ' ')" = '66'
          test -z "$(find /tmp/dock-v11 -type l -print -quit)"
          python3 - <<'PY'
          import json
          with open('/tmp/dock-v11/manifest.json', encoding='utf-8') as f:
              m=json.load(f)
          assert m.get('version') == '0.3.6', m.get('version')
          assert m.get('manifest_version') == 3, m.get('manifest_version')
          PY
          rm -rf dock-extension
          mkdir dock-extension
          cp -a /tmp/dock-v11/. dock-extension/

      - name: Prove exact Git subtree before commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE='d92360a241b27f2a5a4b0343ea398f26dbd945d4'
          git -c core.autocrlf=false -c core.safecrlf=false -c core.attributesfile=/dev/null add -A dock-extension
          ROOT_TREE="$(git -c core.autocrlf=false -c core.safecrlf=false -c core.attributesfile=/dev/null write-tree)"
          SUBTREE="$(git rev-parse "$ROOT_TREE:dock-extension")"
          test "$SUBTREE" = "$EXPECTED_TREE"
          OUTSIDE="$(git diff --cached --name-only | grep -v '^dock-extension/' || true)"
          test -z "$OUTSIDE"
          echo "source_tree=$SUBTREE" >> "$GITHUB_ENV"

      - name: Commit and push exact v11 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dock-release-bot'
          git config user.email 'dock-release-bot@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'dock-extension already matches accepted v11 tree.'
          else
            git commit -m 'Canonicalize accepted Dock 0.3.6 v11 artifact'
            git push origin HEAD:canonicalize-dock-0-3-6-final
          fi

      - name: Verify committed and remote identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE='d92360a241b27f2a5a4b0343ea398f26dbd945d4'
          COMMIT_SHA="$(git rev-parse HEAD)"
          COMMITTED_TREE="$(git rev-parse HEAD:dock-extension)"
          test "$COMMITTED_TREE" = "$EXPECTED_TREE"
          git fetch -q origin canonicalize-dock-0-3-6-final
          REMOTE_SHA="$(git rev-parse origin/canonicalize-dock-0-3-6-final)"
          REMOTE_TREE="$(git rev-parse origin/canonicalize-dock-0-3-6-final:dock-extension)"
          test "$REMOTE_SHA" = "$COMMIT_SHA"
          test "$REMOTE_TREE" = "$EXPECTED_TREE"
          printf 'PASS\nsource_commit=%s\nsource_tree=%s\nartifact_sha=%s\n' "$COMMIT_SHA" "$REMOTE_TREE" "$artifact_sha"
