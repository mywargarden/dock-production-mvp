name: Sync Dock 0.3.27 Exact Extension Source

on:
  push:
    branches:
      - release/dock-0.3.27-rc
    paths:
      - '.release-overlay/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/dock-0.3.27-rc
          fetch-depth: 0
      - name: Rehydrate exact extension source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f .release-overlay/READY
          cat .release-overlay/chunk-* > /tmp/dock-overlay.b64
          base64 -d /tmp/dock-overlay.b64 > /tmp/dock-overlay.tar.gz

          # Preserve only the heavyweight theme assets whose Git blob hashes
          # are byte-identical to the approved 0.3.26 candidate. Everything
          # else is replaced from the exact hardening overlay below.
          mkdir -p /tmp/dock-heavy/assets
          for f in \
            cozy-quilt.webp \
            crazy-ducky-theme.webp \
            dock-default-theme-20260901.png \
            dock-sunset-hd.png \
            dock-sunset.webp \
            dock_logo.png \
            grape-tide.webp \
            rubber-ducky-theme.webp \
            sand-castle-theme.webp \
            smileys-3d.webp \
            tie-dye-bg.webp \
            skipper-harbor-hd.png \
            skipper-harbor.png; do
            cp "dock-extension/assets/$f" "/tmp/dock-heavy/assets/$f"
          done

          rm -rf dock-extension
          mkdir -p dock-extension/assets
          cp /tmp/dock-heavy/assets/* dock-extension/assets/
          tar -xzf /tmp/dock-overlay.tar.gz -C dock-extension

          bash scripts/static_check.sh

          rm -rf .release-overlay
          git rm -f .github/workflows/sync-0327-overlay.yml
          git add -A dock-extension .release-overlay || true

          git config user.name 'Dock Release Bot'
          git config user.email 'dock-release-bot@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No extension changes to commit.'
            exit 0
          fi
          git commit -m 'Sync exact Dock 0.3.27 extension source'
          git push origin HEAD:release/dock-0.3.27-rc
