name: Dock Apple Parity Check
on:
  push:
    branches: [apple-parity-0-3-10]
    paths: [dock-extension/**, apple/**, .github/workflows/apple-parity-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Parse manifest and JS
        run: |
          python3 -m json.tool dock-extension/manifest.json >/dev/null
          find dock-extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Freeze Apple 0.3.10 parity contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('dock-extension/manifest.json').read_text())
          assert m['version']=='0.3.10'
          p=set(m['permissions'])
          assert {'storage','tabs','activeTab','alarms','nativeMessaging','clipboardWrite'} <= p
          assert 'identity' not in p and 'identity.email' not in p
          assert m['background']['service_worker']=='apple-entry.js'
          assert any('safari-auth-callback.js' in x.get('js',[]) for x in m.get('content_scripts',[]))
          r=[v for x in m['web_accessible_resources'] for v in x['resources']]
          assert all(v in r for v in ['import.html','import.js','import-v2.js'])
          imp=Path('dock-extension/import-v2.js').read_text()
          for v in ['IMPORT_PREVIEW_MAX_WIDTH = 420','IMPORT_PREVIEW_MAX_HEIGHT = 260','IMPORT_PREVIEW_TARGET_CHARS = 45000','materializeSharedPreview','materializeImportedTabs','Copying shared previews into Dock…']:
              assert v in imp
          assert "codec = 'image/webp'" in imp and "codec = 'image/jpeg'" in imp
          assert 'buildSafeSharedPreview' not in imp
          assert Path('dock-extension/assets/theme-store-coming-soon.webp').exists()
          assert 'theme-store-coming-soon.webp' in Path('dock-extension/theme-store.html').read_text()
          assert 'src="apple-popup.js"' in Path('dock-extension/popup.html').read_text()
          assert 'src="apple-memories.js"' in Path('dock-extension/memories.html').read_text()
          assert 'safari-web-extension://' in Path('dock-extension/core/logic.js').read_text()
          g=Path('apple/generate_xcode_project.command').read_text()
          assert 'DOCK_APPLE_VERSION:-0.3.10' in g and 'DOCK_APPLE_BUILD_NUMBER:-310' in g
          print('Dock Apple 0.3.10 parity contract PASS')
          PY
      - name: Verify no old localhost helper
        run: '! grep -R -nE "127\\.0\\.0\\.1:47831|DockHelper" dock-extension apple/SafariWebExtensionHandler.swift apple/generate_xcode_project.command'
      - name: Package
        run: |
          mkdir -p artifact
          cp -R dock-extension apple artifact/
          chmod +x artifact/apple/generate_xcode_project.command
          cat > artifact/START_DOCK_APPLE.command <<'SH'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          chmod +x apple/generate_xcode_project.command
          exec ./apple/generate_xcode_project.command
          SH
          chmod +x artifact/START_DOCK_APPLE.command
          printf '%s\n' "$GITHUB_SHA" > artifact/APPLE_CANDIDATE_COMMIT.txt
          cd artifact && zip -qry ../dock-apple-parity-0.3.10.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: dock-apple-parity-0.3.10
          path: dock-apple-parity-0.3.10.zip
