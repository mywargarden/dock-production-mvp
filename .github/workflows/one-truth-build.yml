name: Dock Clean Build

on:
  push:
    branches:
      - main
      - one-truth-next15-candidate
    paths:
      - dock-admin-app/**
      - .github/workflows/one-truth-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dock-admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dock-admin-app/package-lock.json
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
        run: npm run build
