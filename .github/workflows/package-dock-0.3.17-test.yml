name: Package Dock 0.3.17 Professional Test

on:
  push:
    branches:
      - feature/dock-0.3.17-instant-previews-theme-waffle

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Run static gates
        run: ./scripts/static_check.sh
      - name: Install Chrome test harness
        run: npm install --no-save puppeteer@25.10.0
      - name: Normalize New Tab regression release assertion
        run: sed -i -E 's/0\.3\.(15|16)/0.3.17/g' scripts/chrome_newtab_8.mjs
      - name: Run Chrome New Tab regression attack
        run: xvfb-run -a node scripts/chrome_newtab_8.mjs
      - name: Run real-profile preview locality attack
        run: xvfb-run -a node scripts/chrome_preview_storage_9.mjs
      - name: Run per-Dock theme ownership and waffle attack
        run: xvfb-run -a node scripts/chrome_group_theme_10.mjs
      - name: Build single user package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate-out
          mkdir -p candidate-out/DOCK_0317_READY
          rsync -a dock-extension/ candidate-out/DOCK_0317_READY/ \
            --exclude='*.md' \
            --exclude='background.js' \
            --exclude='import.js'

          test -f candidate-out/DOCK_0317_READY/manifest.json
          test -f candidate-out/DOCK_0317_READY/group-theme.js
          test -f candidate-out/DOCK_0317_READY/preview-runtime.js
          test -f candidate-out/DOCK_0317_READY/core/previewPayloadStore.js
          test ! -e candidate-out/DOCK_0317_READY/background.js
          test ! -e candidate-out/DOCK_0317_READY/import.js

          test "$(node -e 'const m=require("./candidate-out/DOCK_0317_READY/manifest.json"); process.stdout.write(m.version)')" = '0.3.17'
          test "$(node -e 'const m=require("./candidate-out/DOCK_0317_READY/manifest.json"); process.stdout.write(m.background?.service_worker||"")')" = 'background-v3.js'

          # User delivery contract: ZIP CONTENTS, not a wrapper directory.
          # Unzip once and the folder created by macOS has manifest.json directly inside.
          (
            cd candidate-out/DOCK_0317_READY
            zip -X -q -r ../DOCK_0317_READY.zip .
          )

          unzip -Z1 candidate-out/DOCK_0317_READY.zip | grep -qx 'manifest.json'
          test "$(unzip -p candidate-out/DOCK_0317_READY.zip manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = '0.3.17'

          sha256sum candidate-out/DOCK_0317_READY.zip > candidate-out/DOCK_0317_READY.zip.sha256
          printf 'commit=%s\nversion=0.3.17\nzip_root=manifest.json\n' "$CANDIDATE_SHA" > candidate-out/ARTIFACT_ID.txt
      - name: Upload exact tested user package
        uses: actions/upload-artifact@v4
        with:
          name: Dock-0.3.17-exact-tested-user-package
          path: |
            candidate-out/DOCK_0317_READY.zip
            candidate-out/DOCK_0317_READY.zip.sha256
            candidate-out/ARTIFACT_ID.txt
          if-no-files-found: error
          retention-days: 14
