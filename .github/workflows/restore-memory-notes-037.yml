name: Restore Dock 0.3.7 Memory Notes

on:
  push:
    branches:
      - restore-memory-notes-0-3-7
    paths:
      - scripts/restore_memory_notes_0_3_7.py
      - .github/workflows/restore-memory-notes-037.yml

permissions:
  contents: write

jobs:
  restore-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-memory-notes-0-3-7
          fetch-depth: 0

      - name: Apply fail-closed notes patch
        run: python3 scripts/restore_memory_notes_0_3_7.py

      - name: Verify extension source
        shell: bash
        run: |
          set -euo pipefail
          node --check dock-extension/memories.js
          test "$(node -p "require('./dock-extension/manifest.json').version")" = "0.3.7"
          grep -Fq 'noteLabel.textContent = "Notes"' dock-extension/memories.js
          grep -Fq 'firstBatch.map((t) => createCard(t))' dock-extension/memories.js
          grep -Fq 'chunk.map((t) => createCard(t))' dock-extension/memories.js
          ! grep -Fq 'createCard(t, false)' dock-extension/memories.js
          grep -Fq 'Dock 0.3.7 personal memory notes restoration' dock-extension/memories.css
          grep -Fq 'body[data-density="compact"] .dockNoteRow{' dock-extension/memories.css
          grep -Fq 'display:block !important;' dock-extension/memories.css
          test -f dock-extension/RELEASE_NOTES_v0.3.7.md

      - name: Commit source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dock-release-bot'
          git config user.email 'dock-release-bot@users.noreply.github.com'
          git add dock-extension/memories.js dock-extension/memories.css dock-extension/manifest.json dock-extension/RELEASE_NOTES_v0.3.7.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Restore personal memory notes in Dock 0.3.7'
            git push origin HEAD:restore-memory-notes-0-3-7
          fi
